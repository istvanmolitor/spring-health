<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Spring Health</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-white text-slate-900">

<header class="sticky top-0 z-50 bg-white/80 backdrop-blur border-b border-slate-100">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2 text-xl font-extrabold tracking-tight">
            <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-emerald-500 to-teal-600 text-white text-sm">SH</span>
            <span class="bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">Spring Health</span>
        </a>
        <nav class="flex items-center gap-6 text-sm font-medium text-slate-600">
            <a href="/#funkciok" class="hidden sm:inline hover:text-slate-900 transition-colors">Funkciók</a>
            <a th:if="${currentUsername != null}" href="/dashboard" class="hover:text-slate-900 transition-colors">Dashboard</a>
            <span th:if="${currentUsername != null}" class="hidden sm:inline text-slate-400" th:text="${currentUsername}">Felhasználó</span>
            <form th:if="${currentUsername != null}" th:action="@{/logout}" method="post" class="inline m-0">
                <button type="submit" class="hover:text-slate-900 transition-colors underline underline-offset-2">Kijelentkezés</button>
            </form>
            <a th:if="${currentUsername == null}" href="/login"
               class="rounded-full bg-slate-900 px-4 py-2 text-white hover:bg-slate-700 transition-colors">Bejelentkezés</a>
        </nav>
    </div>
</header>

<main class="flex-1 w-full" th:replace="${content}">
</main>

<footer class="bg-slate-950 text-slate-400 text-sm">
    <div class="max-w-6xl mx-auto px-6 py-10 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2 text-slate-200 font-semibold">
            <span class="inline-flex h-6 w-6 items-center justify-center rounded-md bg-gradient-to-br from-emerald-500 to-teal-600 text-white text-xs">SH</span>
            Spring Health
        </div>
        <p>&copy; 2026 Spring Health &mdash; Kövesd nyomon az egészséged.</p>
    </div>
</footer>

</body>
</html>
