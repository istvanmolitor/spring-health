<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Spring Health - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">

<header class="bg-slate-900 text-white shadow">
    <div class="px-4 sm:px-6 py-3 flex items-center justify-between">
        <a href="/dashboard" class="flex items-center gap-2 text-lg font-bold tracking-tight">
            <span class="inline-flex h-7 w-7 items-center justify-center rounded-lg bg-gradient-to-br from-emerald-500 to-teal-600 text-white text-xs">SH</span>
            Spring Health <span class="text-slate-400 font-medium">/ admin</span>
        </a>
        <nav class="flex items-center gap-5 text-sm font-medium text-slate-300">
            <a href="/" class="hover:text-white transition-colors">Főoldal</a>
            <span th:if="${currentUsername != null}" class="text-white" th:text="${currentUsername}">Felhasználó</span>
            <form th:if="${currentUsername != null}" th:action="@{/logout}" method="post" class="inline m-0">
                <button type="submit" class="hover:text-white transition-colors underline underline-offset-2">Kijelentkezés</button>
            </form>
        </nav>
    </div>
</header>

<div class="flex-1 flex flex-col md:flex-row">

    <aside class="md:w-60 shrink-0 bg-slate-900 text-slate-300">
        <nav class="px-3 py-4 flex md:flex-col gap-1 overflow-x-auto md:overflow-visible">
            <a href="/dashboard"
               class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium whitespace-nowrap"
               th:classappend="${requestURI == '/dashboard'} ? 'bg-slate-800 text-white' : 'text-slate-300 hover:bg-slate-800 hover:text-white'">
                <span>📊</span> Dashboard
            </a>
            <a href="/exercises"
               class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium whitespace-nowrap"
               th:classappend="${requestURI.startsWith('/exercises')} ? 'bg-slate-800 text-white' : 'text-slate-300 hover:bg-slate-800 hover:text-white'">
                <span>💪</span> Edzés gyakorlatok
            </a>
            <span class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium whitespace-nowrap text-slate-500 cursor-not-allowed">
                <span>🍎</span> Étkezés <span class="ml-auto text-[10px] uppercase tracking-wide bg-slate-800 text-slate-400 rounded px-1.5 py-0.5">hamarosan</span>
            </span>
            <span class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium whitespace-nowrap text-slate-500 cursor-not-allowed">
                <span>😴</span> Alvás <span class="ml-auto text-[10px] uppercase tracking-wide bg-slate-800 text-slate-400 rounded px-1.5 py-0.5">hamarosan</span>
            </span>
            <span class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium whitespace-nowrap text-slate-500 cursor-not-allowed">
                <span>⚖️</span> Súly <span class="ml-auto text-[10px] uppercase tracking-wide bg-slate-800 text-slate-400 rounded px-1.5 py-0.5">hamarosan</span>
            </span>
        </nav>
    </aside>

    <main class="flex-1 min-w-0 px-4 sm:px-8 py-8" th:replace="${content}">
    </main>

</div>

</body>
</html>
