<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-admin :: layout(title='Spring Health - Edzés gyakorlatok', content=~{::section})}">
<head><title>Spring Health - Edzés gyakorlatok</title></head>
<body>

<section>
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Edzés gyakorlatok</h1>
            <p class="text-slate-500">Gyakorlatok kezelése</p>
        </div>
        <a href="/exercises/new"
           class="inline-flex items-center gap-2 rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700 transition-colors">
            + Új gyakorlat
        </a>
    </div>

    <form method="get" th:action="@{/exercises}" class="mb-4 flex items-center gap-2">
        <input type="text" name="q" th:value="${q}" placeholder="Keresés név alapján…"
               class="w-full max-w-xs rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"/>
        <input type="hidden" name="sort" th:value="${sort}"/>
        <input type="hidden" name="dir" th:value="${dir}"/>
        <input type="hidden" name="size" th:value="${size}"/>
        <button type="submit"
                class="rounded-lg bg-slate-800 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700 transition-colors">
            Keresés
        </button>
        <a th:if="${q != null and !q.isEmpty()}"
           th:href="@{/exercises(sort=${sort}, dir=${dir}, size=${size})}"
           class="text-sm text-slate-500 hover:text-slate-700">Szűrő törlése</a>
    </form>

    <div class="overflow-x-auto rounded-lg border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full divide-y divide-slate-200 text-sm">
            <thead class="bg-slate-50">
            <tr>
                <th class="px-4 py-3 text-left font-semibold text-slate-600">
                    <a th:href="@{/exercises(page=0, size=${size}, q=${q}, sort='name', dir=${sort == 'name' and dir == 'asc' ? 'desc' : 'asc'})}"
                       class="inline-flex items-center gap-1 hover:text-slate-900">
                        Név
                        <span th:if="${sort == 'name'}" th:text="${dir == 'asc'} ? '▲' : '▼'"></span>
                    </a>
                </th>
                <th class="px-4 py-3 text-left font-semibold text-slate-600">
                    <a th:href="@{/exercises(page=0, size=${size}, q=${q}, sort='group', dir=${sort == 'group' and dir == 'asc' ? 'desc' : 'asc'})}"
                       class="inline-flex items-center gap-1 hover:text-slate-900">
                        Csoport
                        <span th:if="${sort == 'group'}" th:text="${dir == 'asc'} ? '▲' : '▼'"></span>
                    </a>
                </th>
                <th class="px-4 py-3 text-left font-semibold text-slate-600">
                    <a th:href="@{/exercises(page=0, size=${size}, q=${q}, sort='description', dir=${sort == 'description' and dir == 'asc' ? 'desc' : 'asc'})}"
                       class="inline-flex items-center gap-1 hover:text-slate-900">
                        Leírás
                        <span th:if="${sort == 'description'}" th:text="${dir == 'asc'} ? '▲' : '▼'"></span>
                    </a>
                </th>
                <th class="px-4 py-3 text-right font-semibold text-slate-600">Műveletek</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="exercise : ${exercises}">
                <td class="px-4 py-3 font-medium text-slate-800" th:text="${exercise.name}">Név</td>
                <td class="px-4 py-3 text-slate-500"
                    th:text="${exercise.exerciseGroup != null} ? ${exercise.exerciseGroup.name} : '-'">Csoport</td>
                <td class="px-4 py-3 text-slate-500" th:text="${exercise.description}">Leírás</td>
                <td class="px-4 py-3 text-right whitespace-nowrap">
                    <a th:href="@{/exercises/{id}/edit(id=${exercise.id})}"
                       class="text-emerald-600 hover:text-emerald-800 font-medium mr-3">Szerkesztés</a>
                    <form th:action="@{/exercises/{id}/delete(id=${exercise.id})}" method="post" class="inline"
                          onsubmit="return confirm('Biztosan törlöd a gyakorlatot?');">
                        <button type="submit" class="text-red-600 hover:text-red-800 font-medium">Törlés</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${exercises.empty}">
                <td colspan="4" class="px-4 py-6 text-center text-slate-400">Nincs a feltételeknek megfelelő gyakorlat.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-4 flex items-center justify-between" th:if="${exercises.totalPages > 0}">
        <p class="text-sm text-slate-500">
            <span th:text="${exercises.totalElements}">0</span> gyakorlat &mdash;
            <span th:text="${exercises.number + 1}">1</span>. / <span th:text="${exercises.totalPages}">1</span> oldal
        </p>
        <div class="flex items-center gap-1">
            <a th:if="${!exercises.first}"
               th:href="@{/exercises(page=${exercises.number - 1}, size=${size}, sort=${sort}, dir=${dir}, q=${q})}"
               class="px-3 py-1.5 rounded-lg border border-slate-200 text-sm text-slate-600 hover:bg-slate-50">Előző</a>
            <span th:unless="${!exercises.first}"
                  class="px-3 py-1.5 rounded-lg border border-slate-100 text-sm text-slate-300">Előző</span>

            <a th:each="p : ${#numbers.sequence(0, exercises.totalPages - 1)}"
               th:href="@{/exercises(page=${p}, size=${size}, sort=${sort}, dir=${dir}, q=${q})}"
               th:text="${p + 1}"
               th:classappend="${p == exercises.number} ? 'bg-emerald-600 text-white border-emerald-600' : 'text-slate-600 border-slate-200 hover:bg-slate-50'"
               class="px-3 py-1.5 rounded-lg border text-sm">1</a>

            <a th:if="${!exercises.last}"
               th:href="@{/exercises(page=${exercises.number + 1}, size=${size}, sort=${sort}, dir=${dir}, q=${q})}"
               class="px-3 py-1.5 rounded-lg border border-slate-200 text-sm text-slate-600 hover:bg-slate-50">Következő</a>
            <span th:unless="${!exercises.last}"
                  class="px-3 py-1.5 rounded-lg border border-slate-100 text-sm text-slate-300">Következő</span>
        </div>
    </div>
</section>

</body>
</html>
