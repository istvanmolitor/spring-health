<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-admin :: layout(title='Spring Health - Gyakorlat', content=~{::section})}">
<head><title>Spring Health - Gyakorlat</title></head>
<body>

<section class="max-w-xl">
    <h1 class="text-2xl font-bold text-slate-900 mb-6"
        th:text="${exercise.id != null} ? 'Gyakorlat szerkesztése' : 'Új gyakorlat'">Gyakorlat</h1>

    <form th:action="${exercise.id != null} ? @{/exercises/{id}(id=${exercise.id})} : @{/exercises}"
          th:object="${exercise}" method="post"
          class="space-y-5 bg-white p-6 rounded-lg border border-slate-200 shadow-sm">

        <div>
            <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Név</label>
            <input type="text" id="name" th:field="*{name}"
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <p class="text-sm text-red-600 mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Hiba</p>
        </div>

        <div>
            <label for="description" class="block text-sm font-medium text-slate-700 mb-1">Leírás</label>
            <textarea id="description" th:field="*{description}" rows="4"
                      class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
            <p class="text-sm text-red-600 mt-1" th:if="${#fields.hasErrors('description')}"
               th:errors="*{description}">Hiba</p>
        </div>

        <div class="flex items-center gap-3 pt-2">
            <button type="submit"
                    class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700 transition-colors">
                Mentés
            </button>
            <a href="/exercises" class="text-sm text-slate-500 hover:text-slate-700">Mégse</a>
        </div>

    </form>
</section>

</body>
</html>
