<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='Spring Health - Bejelentkezés', content=~{::section})}">
<head><title>Spring Health - Bejelentkezés</title></head>
<body>

<section class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold mb-6">Bejelentkezés</h1>

    <p th:if="${param.error}" class="mb-4 text-red-600">
        Hibás felhasználónév vagy jelszó.
    </p>
    <p th:if="${param.logout}" class="mb-4 text-green-600">
        Sikeresen kijelentkezett.
    </p>

    <form th:action="@{/login}" method="post" class="space-y-4">
        <div>
            <label for="username" class="block text-sm font-medium mb-1">Felhasználónév</label>
            <input type="text" id="username" name="username" required autofocus
                   class="w-full border border-gray-300 rounded px-3 py-2">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium mb-1">Jelszó</label>
            <input type="password" id="password" name="password" required
                   class="w-full border border-gray-300 rounded px-3 py-2">
        </div>
        <button type="submit"
                class="w-full bg-blue-700 text-white font-medium py-2 rounded hover:bg-blue-800 transition-colors">
            Bejelentkezés
        </button>
    </form>
</section>

</body>
</html>
